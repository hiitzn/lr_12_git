name: AI PR Review with Ollama and Linters

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          pip install flake8 bandit

      - name: Run flake8
        id: flake8
        continue-on-error: true
        run: |
          flake8 . --count --max-complexity=10 --max-line-length=120 --statistics > flake8_report.txt || true
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat flake8_report.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run bandit
        id: bandit
        continue-on-error: true
        run: |
          bandit -r . -f txt -o bandit_report.txt || true
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat bandit_report.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in {1..30}; do curl -s http://localhost:11434/api/tags && break; sleep 1; done
          ollama pull tinyllama

      - name: Get PR diff
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.diff" \
            "${{ github.event.pull_request.diff_url }}" > pr.diff
          # Обрезаем по строкам, чтобы не сломать UTF-8
          head -n 200 pr.diff > pr_diff_small.txt

      - name: Generate AI description + review
        id: ai
        run: |
          DIFF=$(cat pr_diff_small.txt | jq -sR .)
          FLAKE=$(echo '${{ steps.flake8.outputs.report }}' | head -c 2000 | jq -sR .)
          BANDIT=$(echo '${{ steps.bandit.outputs.report }}' | head -c 2000 | jq -sR .)

          PROMPT="Ты — senior разработчик. Проанализируй изменения в коде и результаты линтеров. Опиши основные изменения, укажи на потенциальные ошибки, нарушения стиля, проблемы безопасности. Ответ на русском языке в формате Markdown. Будь конкретен.\n\n--- DIFF (изменения) ---\n$DIFF\n\n--- Flake8 (стиль/синтаксис) ---\n$FLAKE\n\n--- Bandit (безопасность) ---\n$BANDIT"

          # Безопасное создание JSON через jq
          jq -n --arg model "tinyllama" --arg prompt "$PROMPT" '{model: $model, prompt: $prompt, stream: false}' > payload.json
          RESPONSE=$(curl -s -X POST http://localhost:11434/api/generate -d @payload.json)

          COMMENT=$(echo "$RESPONSE" | jq -r '.response')
          echo "comment<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🤖 AI Code Review (Ollama/tinyllama)\n\n${{ steps.ai.outputs.comment }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });