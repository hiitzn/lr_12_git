{% extends "base.html" %}
{% block content %}
<h2>{{ 'Редактировать блюдо' if item else 'Новое блюдо' }}</h2>
<form method="post">
    <label>Название:</label>
    <input type="text" name="name" value="{{ item.name if item else '' }}" required><br><br>

    <label>Цена:</label>
    <input type="number" step="0.01" name="price" value="{{ item.price if item else '' }}" required><br><br>

    <label>Категория:</label>
    <input type="text" name="category" value="{{ item.category if item else '' }}" required><br><br>

    <hr>
    <h3>Рецепт (для поваров)</h3>

    <label>Ингредиенты:</label>
    <textarea name="ingredients" rows="5" style="width:100%;">{{ item.ingredients if item else '' }}</textarea>
    <small>Введите список ингредиентов (каждый с новой строки)</small><br><br>

    <label>Инструкция приготовления:</label>
    <textarea name="instructions" rows="8" style="width:100%;">{{ item.instructions if item else '' }}</textarea>
    <small>Пошаговая инструкция приготовления</small><br><br>

    <label>Время приготовления (минут):</label>
    <input type="number" name="cooking_time" value="{{ item.cooking_time if item else 30 }}"><br><br>

    <button type="submit">Сохранить</button>
    <a href="/pages/menu" class="btn" style="background: #6c757d; text-decoration: none;">Назад</a>
</form>
{% endblock %}
