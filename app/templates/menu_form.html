{% extends "base.html" %}
{% block content %}
<h2>{{ 'Редактировать' if item else 'Новое блюдо' }}</h2>
<form method="post">
    Название: <input type="text" name="name" value="{{ item.name if item else '' }}" required><br>
    Цена: <input type="number" step="0.01" name="price" value="{{ item.price if item else '' }}" required><br>
    Категория: <input type="text" name="category" value="{{ item.category if item else '' }}" required><br>
    <button type="submit">Сохранить</button>
</form>
{% endblock %}
