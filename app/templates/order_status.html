{% extends "base.html" %}
{% block content %}
<h2>Изменить статус заказа #{{ order.id }}</h2>
<form method="post">
    <select name="status">
        {% for status in allowed_statuses %}
        <option value="{{ status }}" {% if order.status == status %}selected{% endif %}>
            {% if status == 'new' %}Новый
            {% elif status == 'cooking' %}Готовится
            {% elif status == 'ready' %}Готов
            {% elif status == 'paid' %}Оплачен
            {% endif %}
        </option>
        {% endfor %}
    </select>
    <button type="submit">Сохранить</button>
    
    {% if from_history %}
        <a href="/pages/orders/history" class="btn" style="background: #6c757d; text-decoration: none;">Назад к истории</a>
    {% else %}
        <a href="/pages/orders" class="btn" style="background: #6c757d; text-decoration: none;">Назад к моим заказам</a>
    {% endif %}
</form>
{% endblock %}
